<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Map with Leaflet</title>
    
    <!-- Import Materialize CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    
    <!-- Import Leaflet CSS -->
    <link href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" rel="stylesheet" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <nav>
        <div class="nav-wrapper">
          <a href="index.html" class="brand-logo">Patrick O'Shea</a>
          <a href="#" data-target="mobile-demo" class="sidenav-trigger">
            <i class="material-icons">menu</i>
          </a>
          <ul class="right hide-on-med-and-down">
            <li><a href="index.html">About Me</a></li>
            <li><a href="map.html">Map Gallery</a></li>
            <li><a href="tool.html">App/Tool Gallery</a></li>
            <li><a href="projects.html">Interactive Project Map</a></li>
          </ul>
        </div>
      </nav>

      <!-- Sidenav for mobile view -->
      <ul class="sidenav" id="mobile-demo">
        <li><a href="index.html">About Me</a></li>
        <li><a href="map.html">Map Gallery</a></li>
        <li><a href="tool.html">App/Tool Gallery</a></li>
        <li><a href="projects.html">Interactive Project Map</a></li>
      </ul>

      <div class="container">
        <div class="row">
            <div class="col s12">
                <span class="white-text">
                    <h3>Interactive Map</h3>
                </span>
            </div>
        </div>
        <!-- Map Container -->
        <div class="row">
            <div class="col s12">
                <div id="map" class="responsive-map"></div>
            </div>
        </div>
    </div>

    <!-- Import Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    
    <!-- Import Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

    <script>
        // Initialize the sidenav
        document.addEventListener('DOMContentLoaded', function() {
          const elems = document.querySelectorAll('.sidenav');
          const instances = M.Sidenav.init(elems);
        });
      </script>

    <script>
        // Initialize the map and set its view
var map = L.map('map').setView([28.6, 77.2], 10);

// Add a Tile Layer (OSM in this case)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
}).addTo(map);

// Fetch the JSON data and create markers with popups
fetch('projects_web_2.json')
    .then(response => response.json())
    .then(data => {
        data.forEach(item => {
            // Create a marker for each item
            var marker = L.marker([item.Lat, item.Lon]).addTo(map);

            // Define the pop-up content with Materialize styles
            var popupContent = `
                <div class="card">
                    <div class="card-content">
                        <span class="card-title">${item.Name}</span>
                        <p>${item.ProjectSummary}</p>
                        <br>
                        <p>Skills Utilized: ${item.SkillsUtilized}</p>
                    </div>
                </div>
            `;

            // Bind the pop-up to the marker
            marker.bindPopup(popupContent);
        });
    })
    .catch(error => console.error('Error fetching JSON data:', error));
    </script>

</body>
</html>
