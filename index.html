<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Speakers</title>
  <style>
    :root{
        --bg:#140c1f;                /* deep plum background */
        --panel:#1b112a;             /* side panel */
        --card:#201436;              /* cards */

        --text:#f4effa;              
        --muted:#c9bddb;

        --border:rgba(255,255,255,.14);

        --shadow: 0 12px 30px rgba(0,0,0,.45);

        --radius: 18px;

        /* WIG accent colors */
        --primary:#9b4dff;           /* signature purple */
        --secondary:#ff6b6b;         /* coral pop */

        --chip:#2b1c44;
        --chipOn:#9b4dff;
        --chipOnText:#ffffff;

        --focus: 0 0 0 3px rgba(155,77,255,.45);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: radial-gradient(1200px 700px at 10% 0%, rgba(42,79,255,.25), transparent 60%),
                  radial-gradient(900px 600px at 90% 20%, rgba(0,200,255,.18), transparent 55%),
                  var(--bg);
      color:var(--text);
    }
    a{color:inherit;text-decoration:none}
    .page{
      max-width:1200px;
      margin:0 auto;
      padding:28px 18px 60px;
    }
    header{
      display:flex;
      gap:16px;
      align-items:flex-end;
      justify-content:space-between;
      margin-bottom:18px;
    }
    .title h1{margin:0;font-size:28px;letter-spacing:.2px}
    .title p{margin:6px 0 0;color:var(--muted)}
    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-end;
    }
    .input, select{
      background:rgba(255,255,255,.06);
      border:1px solid var(--border);
      color:var(--text);
      padding:10px 12px;
      border-radius:14px;
      outline:none;
      min-width:220px;
    }
    .input:focus, select:focus{box-shadow:var(--focus)}
    .layout{
      display:grid;
      grid-template-columns: 280px 1fr;
      gap:16px;
      align-items:start;
    }
    @media (max-width: 900px){
      .layout{grid-template-columns:1fr}
    }
    .panel{
      background:rgba(255,255,255,.04);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }
    .filters{
      padding:14px;
      position:sticky;
      top:14px;
    }
    @media (max-width: 900px){
      .filters{position:relative; top:auto}
    }
    .filtersTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }
    .filtersTop h2{font-size:14px; margin:0; color:var(--muted); font-weight:600; letter-spacing:.2px}
    .btn{
      border:1px solid var(--border);
      background:rgba(255,255,255,.05);
      color:var(--text);
      padding:8px 10px;
      border-radius:12px;
      cursor:pointer;
    }
    .btn:hover{background:rgba(255,255,255,.08)}
    .btn:focus{outline:none; box-shadow:var(--focus)}
    .group{margin-top:12px}
    .groupTitle{font-size:12px; color:var(--muted); margin:0 0 8px 2px}
    .chips{display:flex; flex-wrap:wrap; gap:8px}
    .chip{
      border:1px solid var(--border);
      background:var(--chip);
      color:var(--text);
      padding:7px 10px;
      border-radius:999px;
      cursor:pointer;
      user-select:none;
      font-size:13px;
      line-height:1;
    }
    .chip[aria-pressed="true"]{
      background:rgba(42,79,255,.25);
      border-color:rgba(42,79,255,.55);
      box-shadow: inset 0 0 0 1px rgba(42,79,255,.35);
    }
    .results{
      padding:14px;
    }
    .metaRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:12px;
      color:var(--muted);
      font-size:13px;
    }
    .activeChips{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .activeChip{
      background:rgba(255,255,255,.06);
      border:1px solid var(--border);
      padding:7px 10px;
      border-radius:999px;
      font-size:13px;
      color:var(--text);
      display:flex;
      gap:8px;
      align-items:center;
    }
    .x{
      border:0;
      background:transparent;
      color:var(--muted);
      cursor:pointer;
      font-size:16px;
      line-height:0;
    }
    .grid{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:14px;
    }
    @media (max-width: 1100px){ .grid{grid-template-columns: repeat(2, 1fr);} }
    @media (max-width: 600px){ .grid{grid-template-columns: 1fr;} }
    .card{
      background:rgba(255,255,255,.04);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      transition: transform .12s ease, border-color .12s ease;
      display:flex;
      flex-direction:column;
      min-height: 240px;
    }
    .card:hover{ transform: translateY(-2px); border-color: rgba(255,255,255,.16); }
    .cardTop{
      display:flex;
      gap:12px;
      padding:14px 14px 10px;
      align-items:center;
    }
    .avatar{
      width:44px; height:44px;
      border-radius:14px;
      background:rgba(255,255,255,.08);
      border:1px solid var(--border);
      display:grid; place-items:center;
      font-weight:700;
      color:rgba(255,255,255,.88);
      flex:0 0 auto;
      overflow:hidden;
    }
    .avatar img{width:100%;height:100%;object-fit:cover}
    .name{font-weight:700}
    .sub{color:var(--muted); font-size:13px; margin-top:2px}
    .bio{
      padding:0 14px 10px;
      color:rgba(232,238,252,.92);
      font-size:13px;
      line-height:1.35;
      display:-webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow:hidden;
      min-height: 52px;
      cursor: pointer;
      transition: all .2s ease;
    }
    .bio.expanded{
      display:block;
      -webkit-line-clamp: unset;
      -webkit-box-orient: unset;
      overflow:visible;
    }
    .tagRow{
      padding:0 14px 12px;
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      color:var(--muted);
      font-size:12px;
    }
    .tag{
      background:rgba(255,255,255,.06);
      border:1px solid var(--border);
      padding:6px 8px;
      border-radius:999px;
    }
    .cardBottom{
      margin-top:auto;
      padding:12px 14px 14px;
      display:flex;
      gap:10px;
      justify-content:space-between;
      align-items:center;
      border-top:1px solid rgba(255,255,255,.08);
    }
    .cta{
      display:flex;
      gap:10px;
    }
    .linkBtn{
      padding:9px 12px;
      border-radius:12px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.05);
      font-size:13px;
    }
    .primary{
      background:rgba(42,79,255,.25);
      border-color:rgba(42,79,255,.55);
    }
    .empty{
      padding:28px 10px;
      text-align:center;
      color:var(--muted);
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="title">
        <h1>Women+ In Geospatial Speakers Database</h1>
        <p>Find your next speaker from our diverse talented community</p>
      </div>

      <div class="controls">
        <input id="search" class="input" placeholder="Search name, org, bio…" />
        <select id="sort">
          <option value="featured">Featured</option>
          <option value="az">A → Z</option>
          <option value="recent">Recently updated</option>
        </select>
      </div>
    </header>

    <div class="layout">
      <aside class="panel filters">
        <div class="filtersTop">
          <h2>FILTERS</h2>
          <button class="btn" id="clear">Clear</button>
        </div>

        <div class="group">
          <p class="groupTitle">Tags</p>
          <div class="chips" id="tagChips"></div>
        </div>
      </aside>

      <main class="panel results">
        <div class="metaRow">
          <div id="count"></div>
          <div class="activeChips" id="activeChips"></div>
        </div>

        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" style="display:none;">
          No speakers match these filters. <button class="btn" id="clear2">Clear filters</button>
        </div>
      </main>
    </div>
  </div>

<script>
  // --- CONFIGURATION ---
  // Paste your Published CSV URL here
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQerYM6BEcGI6TkorXIpPAoLwMF9mxAe0qsBUEsvDNhBAsgVMHDW56REuk3zBvXO5Gf9oK4nB9LDkdY/pub?output=csv";

  // State
  let speakers = [];
  let allTags = [];
  let selectedTags = new Set();
  let searchText = "";
  let sortMode = "featured";

  // DOM Elements
  const tagChips = document.getElementById("tagChips");
  const grid = document.getElementById("grid");
  const count = document.getElementById("count");
  const activeChips = document.getElementById("activeChips");
  const empty = document.getElementById("empty");

  // 1. FETCH DATA FROM GOOGLE SHEETS
  async function initData() {
    try {
      const response = await fetch(SHEET_CSV_URL);
      const csvText = await response.text();
      speakers = parseCSV(csvText);
      console.log("All fields:", Object.keys(speakers[0]));
      
      // Build tag list dynamically from the sheet data
      allTags = Array.from(new Set(speakers.flatMap(s => s.tags))).sort();
      
      update(); // Initial render
    } catch (err) {
      console.error("Error loading sheet data:", err);
      grid.innerHTML = `<div class="empty">Error loading speakers. Check CSV URL and Permissions.</div>`;
    }
  }

  // 2. SIMPLE CSV PARSER
  function parseCSV(csv) {
    const lines = csv.split("\n");
    const headers = lines[0].split(",").map(h => h.trim());
    
    return lines.slice(1).map(line => {
      // Handles basic commas; for complex bios with commas, 
      // consider a more robust regex or library like PapaParse
      const values = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
      const s = {};
      headers.forEach((header, i) => {
        let val = values[i]?.replace(/^"+|"+$/g, "").trim() || "";
        
        // Data Transformation
        if (header === 'tags') s[header] = val ? val.split(",").map(t => t.trim()) : [];
        else if (header === 'featured') s[header] = val.toLowerCase() === 'true';
        else s[header] = val;
      });
      return s;
    }).filter(s => s.name); // Filter out empty rows
  }

  // --- CORE LOGIC (Keep these from your original code) ---

  function renderTagChips(){
    tagChips.innerHTML = "";
    allTags.forEach(tag => {
      const btn = document.createElement("button");
      btn.className = "chip";
      btn.type = "button";
      btn.textContent = tag;
      btn.setAttribute("aria-pressed", selectedTags.has(tag) ? "true" : "false");
      btn.onclick = () => {
        if (selectedTags.has(tag)) selectedTags.delete(tag);
        else selectedTags.add(tag);
        update();
      };
      tagChips.appendChild(btn);
    });
  }

  function matchesFilters(s){
    for (const t of selectedTags){
      if (!s.tags.includes(t)) return false;
    }
    if (searchText.trim()){
      const hay = `${s.name} ${s.title} ${s.organization} ${s.bio}`.toLowerCase();
      if (!hay.includes(searchText.toLowerCase())) return false;
    }
    return true;
  }

  function sortSpeakers(list){
    const copy = [...list];
    if (sortMode === "az") copy.sort((a,b) => a.name.localeCompare(b.name));
    else if (sortMode === "recent") copy.sort((a,b) => new Date(b.lastUpdated) - new Date(a.lastUpdated));
    else copy.sort((a,b) => (b.featured === a.featured) ? a.name.localeCompare(b.name) : (b.featured - a.featured));
    return copy;
  }

  function avatarFor(s){
    if (s.imageUrl && s.imageUrl.startsWith('http')) return `<img src="${s.imageUrl}" alt="${s.name}" />`;
    const initials = s.name.split(" ").slice(0,2).map(x=>x[0]).join("").toUpperCase();
    return `<span aria-hidden="true">${initials}</span>`;
  }

  function renderCards(list){
    grid.innerHTML = "";
    list.forEach(s => {
      const tagsHtml = s.tags.slice(0,4).map(t => `<span class="tag">${t}</span>`).join("");
      const overflow = s.tags.length > 4 ? `<span class="tag">+${s.tags.length-4}</span>` : "";
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <div class="cardTop">
          <div class="avatar">${avatarFor(s)}</div>
          <div>
            <div class="name">${s.name}</div>
            <div class="sub">${s.title} • ${s.organization}</div>
          </div>
        </div>
        <div class="bio" onclick="this.classList.toggle('expanded')" title="Click to expand">${s.bio}</div>
        <div class="tagRow">${tagsHtml}${overflow}</div>
        <div class="cardBottom">
          <div class="sub">Updated ${s.lastUpdated || 'N/A'}</div>
          <div class="cta">
            <a class="linkBtn" onclick="window.open('${s.linkedIn}', '_blank')" style="cursor:pointer">View</a>
            ${s.email ? `<a class="linkBtn primary" href="mailto:${s.email}">Contact</a>` : `<a class="linkBtn primary" href="#">Contact</a>`}
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function update(){
    renderTagChips();
    const filtered = speakers.filter(matchesFilters);
    const sorted = sortSpeakers(filtered);
    
    // Render Active Filters
    activeChips.innerHTML = "";
    [...selectedTags].forEach(t => {
      const chip = document.createElement("span");
      chip.className = "activeChip";
      chip.innerHTML = `${t} <button class="x">×</button>`;
      chip.querySelector("button").onclick = () => { selectedTags.delete(t); update(); };
      activeChips.appendChild(chip);
    });

    renderCards(sorted);
    count.textContent = `${sorted.length} speaker${sorted.length === 1 ? "" : "s"}`;
    empty.style.display = sorted.length ? "none" : "block";
  }

  // --- EVENTS ---
  document.getElementById("search").oninput = (e) => { searchText = e.target.value; update(); };
  document.getElementById("sort").onchange = (e) => { sortMode = e.target.value; update(); };
  document.getElementById("clear").onclick = clearAll;
  document.getElementById("clear2").onclick = clearAll;

  function clearAll(){
    selectedTags.clear();
    searchText = "";
    document.getElementById("search").value = "";
    update();
  }

  // Start the engine
  initData();
</script>
</body>
</html>
